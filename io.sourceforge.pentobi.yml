app-id: io.sourceforge.pentobi
runtime: org.kde.Platform
runtime-version: '6.10'
sdk: org.kde.Sdk
command: pentobi
rename-icon: pentobi
finish-args:
  - --device=dri
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11

modules:
  - name: pentobi
    buildsystem: cmake
    sources:
      - type: git
        url: https://github.com/enz/pentobi.git
        tag: v30.3
        commit: 58356d06457f9d643ba322c3222e4d9871649388
        x-checker-data:
          type: git
          tag-pattern: ^(v[\d.]+)$

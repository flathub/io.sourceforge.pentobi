app-id: io.sourceforge.pentobi
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
command: pentobi
rename-icon: pentobi
finish-args:
  - --device=dri
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11

modules:
  - name: pentobi
    buildsystem: cmake
    sources:
      - type: git
        url: https://github.com/enz/pentobi.git
        tag: v31.0
        commit: d5374ddc20eced902788e733d67ee16bd1836fd3
        x-checker-data:
          type: git
          tag-pattern: ^(v[\d.]+)$
